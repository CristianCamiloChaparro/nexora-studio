name: Publicar instaladores
# Une las partes de cada archivo, comprueba el SHA-256 y crea la Release.
# Las partes se llaman <archivo>.part-aa, <archivo>.part-ab…; TAG y TITLE dicen qué versión es.
on:
  push:
    branches: [release-assets]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-assets
      - name: Unir y comprobar
        run: |
          mkdir out
          for f in $(ls parts | sed 's/\.part-[a-z]*$//' | sort -u); do
            cat parts/"$f".part-* > "out/$f"
          done
          cd out
          sha256sum -c ../SHA256SUMS
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$(cat TAG)" out/* --target main --title "$(cat TITLE)" --notes-file NOTES.md
